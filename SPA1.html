            applyFiltersAndSort();
        }
    }

    function moveColumn(idx, dir) {
        const target = idx + dir;
        // Validar que el movimiento esté dentro de los límites del array
        if (target < 0 || target >= currentHeadersConfig.length) return;

        // Intercambio de posiciones (Swap)
        [currentHeadersConfig[idx], currentHeadersConfig[target]] = 
        [currentHeadersConfig[target], currentHeadersConfig[idx]];
        
        // Actualizamos el índice de propiedad 'order' para mantener coherencia
        currentHeadersConfig.forEach((col, i) => col.order = i + 1);
        
        // Refrescar solo el panel para ver el cambio de posición
        renderColumnConfig();
    }

async function setColumnFilter(idx) {
    const col = currentHeadersConfig[idx];
    const isDate = col.label.toUpperCase().includes('FECHA') || col.label.toUpperCase().includes('DATE');
    
    let initialValue = col.filterValue || '';

    // 1. CONVERSIÓN DE IDA (Para el modal)
    // Ahora manejamos si el valor tiene un rango "DD/MM/YYYY|DD/MM/YYYY"
    if (isDate && initialValue) {
        initialValue = initialValue.split('|').map(v => {
            return v.includes('/') ? v.split('/').reverse().join('-') : v;
        }).join('|');
    }

    const newValue = await showSystemModal({
        title: `Filtrar: ${col.label}`,
        text: isDate ? `Seleccione el rango para "${col.label}":` : `Criterio para "${col.label}":`,
        isPrompt: true,
        inputType: isDate ? 'date' : 'text',
        isRange: isDate, // <--- Esta es la funcionalidad nueva que activa el doble input
        inputValue: initialValue,
        type: 'info',
        showCancel: true
    });

    if (newValue !== null) {
        let finalValue = newValue.trim();
        
        // 2. CONVERSIÓN DE VUELTA (Para la configuración)
        // Convertimos el rango "YYYY-MM-DD|YYYY-MM-DD" de vuelta a "DD/MM/YYYY|DD/MM/YYYY"
        if (isDate && finalValue.includes('-')) {
            finalValue = finalValue.split('|').map(v => {
                return v.includes('-') ? v.split('-').reverse().join('/') : v;
            }).join('|');
        }

        currentHeadersConfig[idx].filterValue = finalValue;
        renderColumnConfig(); 
    }
}

    function updateColVis(idx, val) { 
        // val es un booleano (true para mostrar, false para ocultar)
        currentHeadersConfig[idx].visible = val; 
        renderColumnConfig(); 
    }

async function saveRecord() {
    toggleGlobalLoader(true, "Procesando Registro...", "Sincronizando valores en la base de datos GAS<br>Por favor, espere.");

    const container = document.getElementById('detail-modal-content');
    const inputs = container.querySelectorAll('[data-field]');
    const configMapRaw = JSON.parse(localStorage.getItem('TABLE_CONFIG') || '{}');
    const configMap = {};
    Object.keys(configMapRaw).forEach(k => configMap[k.toUpperCase()] = configMapRaw[k]);

    let missingFields = [];
    let payload = {};

    // 1. LIMPIEZA DE ERRORES VISUALES
    inputs.forEach(i => {
        i.classList.remove('border-red-500', 'bg-red-500/10');
        i.classList.add('border-transparent'); 
    });

 // 2. EXTRACCIÓN Y FORMATEO DE DATOS
    inputs.forEach(input => {
        const key = input.dataset.field;
        const cleanKey = key.toUpperCase();
        const cfg = configMap[cleanKey] || {};
        const isDate = cleanKey.includes('FECHA') || cleanKey.includes('DATE');
        const isTextArea = input.tagName.toLowerCase() === 'textarea';
        
        let value;
        if (input.hasAttribute('data-raw')) {
            value = input.getAttribute('data-raw');
        } else if (input.type === 'checkbox') {
            value = input.checked;
        } else {
            value = input.value.trim();

            // --- LÓGICA DE MAYÚSCULAS SELECTIVA ---
            // Solo convertimos a mayúsculas si:
            // 1. NO es un textarea
            // 2. NO es un campo de fecha (para no romper el formato ISO yyyy-mm-dd antes de convertirlo)
            if (!isTextArea && !isDate && typeof value === 'string') {
                value = value.toUpperCase();
            }
        }

        // --- FORMATEO ESTRICTO DE FECHA ---
        if (isDate && value && typeof value === 'string') {
            // 1. Limpieza absoluta: Nos quedamos solo con lo que esté antes de la 'T' o el espacio
            // Esto elimina "T04:00:00.000Z" de un solo golpe
            let dateOnly = value.split('T')[0].split(' ')[0].trim();

            // 2. Si la fecha viene en formato ISO (YYYY-MM-DD)
            if (dateOnly.includes('-')) {
                const parts = dateOnly.split('-');
                if (parts.length === 3) {
                    // Si el primer bloque es el año (4 dígitos), la invertimos a DD/MM/YYYY
                    if (parts[0].length === 4) {
                        value = `${parts[2]}/${parts[1]}/${parts[0]}`;
                    } else {
                        // Por si acaso viene DD-MM-YYYY
                        value = `${parts[0]}/${parts[1]}/${parts[2]}`;
                    }
                }
            } else {
                // Si no tiene guiones, asumimos que ya es DD/MM/YYYY pero nos aseguramos de que esté limpia
                value = dateOnly;
            }
        }

        // Validación de campos obligatorios
        if (cfg.Es_Obligatorio === true && !value) {
            missingFields.push(cfg.label || key);
            input.classList.add('border-red-500', 'bg-red-500/10');
        }

        payload[key] = value;
    });

// --- 3. VALIDACIONES DE NEGOCIO (BLOQUEO) ---
    const tablePrefix = currentTableName.split('_')[0].toUpperCase();
    const keyImporte = `${tablePrefix}IMPORTE`;

    // A. Validación de Campos Obligatorios (Se mantiene igual)
    if (missingFields.length > 0) {
        toggleGlobalLoader(false);
        const listaHtml = missingFields.map(field => `• ${field}`).join('<br>');
        await showSystemModal({ title: 'Campos Obligatorios', text: `Complete:<br><br>${listaHtml}`, type: 'warning' });
        return; 
    }

    // B. VALIDACIÓN: IMPORTE MAYOR A 0.00 (SOLO SI EL CAMPO EXISTE)
    // Verificamos si 'keyImporte' es una propiedad del objeto payload
    if (Object.prototype.hasOwnProperty.call(payload, keyImporte)) {
        const valorImporte = parseFloat(String(payload[keyImporte] || "0").replace(',', '.'));

        if (isNaN(valorImporte) || valorImporte <= 0) {
            toggleGlobalLoader(false);
            const inputImporte = container.querySelector(`[data-field="${keyImporte}"]`);
            if (inputImporte) inputImporte.classList.add('border-red-500', 'bg-red-500/10');

            await showSystemModal({ 
                title: 'Importe Inválido', 
                text: 'El campo <b>Importe</b> debe ser un monto mayor a <b>0,00</b>.', 
                type: 'warning' 
            });
            return;
        }
    }


// C. Traducción de Cuentas y Validación de Monedas/Negocio
    const badgeMode = document.getElementById('title-badge-mode')?.innerText.toUpperCase() || '';
    const matrizCuentas = JSON.parse(localStorage.getItem('MATRIZ_CUENTAS_USUARIO') || "[]");

    // 1. Obtener Moneda de la Transacción (del payload)
    const monedaTransaccion = String(payload[`${tablePrefix}MONEDA`] || "").trim().toUpperCase();

    // 2. Procesamiento de Cuenta Emisora
    const aliasEmisora = payload[`${tablePrefix}ALIASCUENTA`];
    let infoEmisora = null;

    if (aliasEmisora && matrizCuentas.length > 0) {
        infoEmisora = matrizCuentas.find(c => String(c.TD102ALIAS || c.ALIAS).trim() === String(aliasEmisora).trim());
        if (infoEmisora) {
            const monedaE = infoEmisora.TD102MONEDA;
            
            // VALIDACIÓN A: Moneda Transacción vs Cuenta Origen
            if (monedaTransaccion && monedaE && monedaTransaccion !== monedaE) {
                toggleGlobalLoader(false);
                container.querySelector(`[data-field$="ALIASCUENTA"]`)?.classList.add('border-red-500', 'bg-red-500/10');
                
                await showSystemModal({ 
                    title: 'Inconsistencia de Moneda', 
                    text: `La moneda del registro (<b>${monedaTransaccion}</b>) no coincide con la moneda de la cuenta seleccionada (<b>${monedaE}</b>).`, 
                    type: 'error' 
                });
                return;
            }
            
            payload[`${tablePrefix}CUENTA`] = infoEmisora.TD102ID || infoEmisora.ID;
        }
    }

    // 3. Lógica específica para Modo Transferencia (TR)
    if (badgeMode.includes('TR')) {
        const aliasReceptora = payload[`${tablePrefix}CUENTA2`];
        let infoReceptora = null;

        if (aliasReceptora && matrizCuentas.length > 0) {
            infoReceptora = matrizCuentas.find(c => String(c.TD102ALIAS || c.ALIAS).trim() === String(aliasReceptora).trim());
            if (infoReceptora) {
                payload[`${tablePrefix}CUENTA2`] = infoReceptora.TD102ID || infoReceptora.ID;
                payload[`${tablePrefix}ALIASCUENTA2`] = aliasReceptora;
            }
        }

        if (infoEmisora && infoReceptora) {
            const idE = infoEmisora.TD102ID || infoEmisora.ID;
            const idR = infoReceptora.TD102ID || infoReceptora.ID;
            const monedaE = infoEmisora.TD102MONEDA;
            const monedaR = infoReceptora.TD102MONEDA;

            // VALIDACIÓN B: CUENTAS IDÉNTICAS
            if (idE === idR) {
                toggleGlobalLoader(false);
                container.querySelectorAll(`[data-field$="ALIASCUENTA"], [data-field$="CUENTA2"]`)
                    .forEach(el => el.classList.add('border-red-500', 'bg-red-500/10'));

                await showSystemModal({ 
                    title: 'Error en Transferencia', 
                    text: 'La <b>Cuenta Emisora</b> y la <b>Cuenta Receptora</b> no pueden ser iguales.', 
                    type: 'error' 
                });
                return;
            }

            // VALIDACIÓN C: MONEDA ORIGEN VS MONEDA DESTINO
            if (monedaE !== monedaR) {
                toggleGlobalLoader(false);
                container.querySelectorAll(`[data-field$="ALIASCUENTA"], [data-field$="CUENTA2"]`)
                    .forEach(el => el.classList.add('border-red-500', 'bg-red-500/10'));

                await showSystemModal({ 
                    title: 'Conflicto de Moneda', 
                    text: `En transferencias, ambas cuentas deben manejar la misma moneda.<br><br>` +
                          `Origen: <b>${monedaE}</b><br>Destino: <b>${monedaR}</b>`, 
                    type: 'error' 
                });
                return;
            }
        }
    }

    // 4. PREPARACIÓN DE ENVÍO
    const isNewOrDuplicate = badgeMode.includes('BORRADOR') || badgeMode.includes('DUPLICADO');
    const gasAction = isNewOrDuplicate ? 'registerDynamicDataTD' : 'editDynamicDataTD';
    const userId = localStorage.getItem('Usuario_ID') || ""; 

    // --- ASEGURAR MAYÚSCULAS EN EL ESTATUS (TYPEREG) ---
    const keyStatus = `${tablePrefix}TYPEREG`;
    if (payload[keyStatus]) {
        payload[keyStatus] = String(payload[keyStatus]).toUpperCase();
    }

    if (isNewOrDuplicate) {
        delete payload[`${tablePrefix}ID`];
        payload[`${tablePrefix}TYPEREG`] = "REGISTRADO"; // Forzamos mayúsculas aquí también
        payload[`${tablePrefix}IDOWNER`] = userId;      
    }

    const finalPayload = {
        ...payload,
        action: gasAction,
        tiendaId: localStorage.getItem(KEYS.TIENDA_ID), 
        TABLA_DESTINO: currentTableName,
        currentUser: userId
    };

    // 5. ENVÍO ÚNICO
    const createdRecord = await executeSubmit(finalPayload); 

    if (createdRecord) {
        const loaderLabel = document.querySelector('#global-loader span');
        if (loaderLabel) loaderLabel.innerHTML = "Sincronizando registros...<br>Actualizando vista de tabla.";

        needsRefresh = true; 
        await fetchData(currentTableName); 

        document.getElementById('detail-modal')?.classList.add('hidden');
        toggleGlobalLoader(false);
        
        await showSystemModal({ 
            title: 'Proceso Completado', 
            text: 'Solicitud ejecutada correctamente.', 
            type: 'info' 
        });

        if (createdRecord) openDetailModal(createdRecord);
          
    } else {
        toggleGlobalLoader(false);
        showSystemModal({ title: 'Error', text: 'No se pudo guardar el registro.', type: 'error' });
    }
}

async function saveCurrentConfig() {
    if (!currentTableName) return;

    // 1. Elementos de UI
    const configPanel = document.getElementById('column-config-panel');

    // 2. Resolver mappedConfig (Variable global o localStorage)
    let activeMappedConfig = (typeof mappedConfig !== 'undefined') 
        ? mappedConfig 
        : JSON.parse(localStorage.getItem('TABLE_CONFIG') || '{}');

    // --- MEJORA: Loader Personalizado ---
    toggleGlobalLoader(true, "Guardando configuración filtros", "Sincronizando Base de Datos<br>Por favor espere...");

    try {
        // --- A. ACTUALIZACIÓN DE LÓGICA LOCAL ---
        if (typeof tableConfig !== 'undefined') {
            tableConfig.columnOrder = currentHeadersConfig.map(col => col.id);
        }

        // Sincronizamos visibilidad Y el valor del filtro
        currentHeadersConfig.forEach(col => {
            if (activeMappedConfig[col.id]) {
                activeMappedConfig[col.id].visible = col.visible ? 'X' : '';
                // CLAVE: Guardamos el filtro para que renderColumnConfig lo lea después
                activeMappedConfig[col.id].filterValue = col.filterValue; 
            }
        });

        // 3. Persistencia local
        const configData = JSON.stringify(currentHeadersConfig);
        localStorage.setItem(`config_${currentTableName}`, configData);
        localStorage.setItem('TABLE_CONFIG', JSON.stringify(activeMappedConfig));

        if (typeof mappedConfig !== 'undefined') {
            mappedConfig = activeMappedConfig;
        }

        // --- B. SINCRONIZACIÓN CON EL BACKEND ---
        const userId = localStorage.getItem('USUARIO_ID') || 'N/A'; 
        const userName = localStorage.getItem('NOMBRE') || 'Sin Nombre';    
        const userTienda = localStorage.getItem('TIENDA') || 'General';  
        const userTiendaID = localStorage.getItem('TIENDA_ID') || 'N/A';

        const url = `${SCRIPT_URL}?action=saveTableConfig` + 
                    `&userId=${encodeURIComponent(userId)}` + 
                    `&userName=${encodeURIComponent(userName)}` +      
                    `&userTienda=${encodeURIComponent(userTienda)}` +  
                    `&userTiendaID=${encodeURIComponent(userTiendaID)}` + 
                    `&tableName=${encodeURIComponent(currentTableName)}` + 
                    `&configData=${encodeURIComponent(configData)}`;
                        
        const response = await fetch(url);
        const result = await response.json();

        if (result.success) {
            if (configPanel) configPanel.classList.add('hidden');

            // Cerramos loader antes del modal de éxito
            toggleGlobalLoader(false);

            showSystemModal({ 
                title: 'Proceso Completado', 
                text: `La configuración de <b>${currentTableName}</b> se ha sincronizado correctamente.`, 
                type: 'info' 
            });

            if (typeof applyFiltersAndSort === 'function') {
                applyFiltersAndSort(); 
            } else if (typeof renderTable === 'function') {
                renderTable(originalData);
            }
        }
    } catch (e) { 
        console.error("Error en saveCurrentConfig:", e);
        toggleGlobalLoader(false);
        if (typeof applyFiltersAndSort === 'function') applyFiltersAndSort();
    } finally {
        // Garantizamos que el loader se cierre siempre
        toggleGlobalLoader(false);
    }
}

function resetAllColumnFilters(silent = false) {
    // 1. Limpiar el estado de los filtros en el array
    if (currentHeadersConfig) {
        currentHeadersConfig.forEach(col => {
            col.filterValue = "";
        });
    }

    // 2. Refrescar la interfaz visual SOLO si NO es silencio
    // O mejor aún: solo si el panel YA está abierto.
    if (!silent) {
        const panel = document.getElementById('column-config-panel');
        if (panel && !panel.classList.contains('hidden')) {
            renderColumnConfig();
        }
    }

    // 3. Re-aplicar la lógica de la tabla (Esto es lo que limpia los datos)
    if (typeof applyFiltersAndSort === 'function') {
        applyFiltersAndSort();
    }
}

function updateTD102Alias() {
    const content = document.getElementById('detail-modal-content');
    if (!content) return;

    const prefix = currentTableName.split('_')[0].toUpperCase();
    
    // Obtenemos valores de los campos que componen el alias
    const banco = content.querySelector(`[data-field="${prefix}BANCO"]`)?.value || '';
    const tipo = content.querySelector(`[data-field="${prefix}TIPO"]`)?.value || '';
    const moneda = content.querySelector(`[data-field="${prefix}MONEDA"]`)?.value || '';
    
    const aliasKey = "TD102ALIAS";
    const nuevoAlias = `${banco} ${tipo} ${moneda}`.replace(/\s+/g, ' ').trim().toUpperCase();
    
    const aliasInput = content.querySelector(`[data-field="${aliasKey}"]`);
    if (aliasInput) {
        aliasInput.value = nuevoAlias;

        // Actualización visual si está bloqueado (span) o es input
        const container = aliasInput.closest('div');
        const visualSpan = container?.querySelector('span'); // El span que muestra "---"
        
        if (visualSpan && visualSpan.tagName === 'SPAN') {
            visualSpan.textContent = nuevoAlias || '---';
            if (nuevoAlias) {
                visualSpan.classList.remove('text-gray-500');
                visualSpan.classList.add('text-blue-400/90');
            }
        }
    }
}

function applyCardMask(input) {
    // 1. Limpiar todo lo que no sea número
    let value = input.value.replace(/\D/g, '');
    
    // 2. Cortar a un máximo de 16 dígitos (opcional, ajusta según tu DB)
    value = value.substring(0, 16);
    
    // 3. Agrupar de a 4 usando regex
    // El match(/(.{1,4})/g) crea un array de trozos de hasta 4 caracteres
    const sections = value.match(/.{1,4}/g);
    
    if (sections) {
        input.value = sections.join('-');
    } else {
        input.value = value;
    }
}

<script>
function showEditMode() {
    normalizeToolbar();
    ['Duplicar', 'Borrar', 'Nuevo', 'Editar'].forEach(disableButton);
    
    const content = document.getElementById('detail-modal-content');
    const title = document.getElementById('detail-modal-title');

    const dictionary = JSON.parse(localStorage.getItem('VALUE_DICTIONARY') || '{}');

    const configMap = {};
    Object.keys(configMapRaw).forEach(k => configMap[k.toUpperCase()] = configMapRaw[k]);

    document.getElementById('btn-modal-save')?.classList.remove('hidden');
    document.getElementById('btn-modal-cancel')?.classList.remove('hidden');
    document.getElementById('footer-save-container')?.classList.remove('hidden');
    document.getElementById('btn-modal-return')?.classList.add('hidden');

    const storageData = JSON.parse(localStorage.getItem('TABLE_DATA') || '{}');
    const row = storageData.DATOS_REGISTRO;
    if (!row) return;

    const btnCancel = document.getElementById('btn-modal-cancel');
    if (btnCancel) btnCancel.onclick = () => closeDetailModal();

    const tablePrefix = currentTableName.split('_')[0].toUpperCase();
    const idFieldName = tablePrefix + 'ID';
    const refFieldName = tablePrefix + 'REF';
    content.innerHTML = '';

    const movTipo = String(row[tablePrefix + 'MOVIMIENTO'] || '').toUpperCase();
    const valorRefActual = String(row[refFieldName] || '').toUpperCase();
    const isTransferRelated = movTipo === 'TRANSFERENCIA' || valorRefActual.includes('TRANSFERENCIA ');

    const hiddenId = document.createElement('input');
    hiddenId.type = 'hidden';
    hiddenId.dataset.field = idFieldName;
    hiddenId.value = row[idFieldName] || '';
    content.appendChild(hiddenId);

    const rawStatus = row[tablePrefix + 'TYPEREG'] || "REGISTRADO";
    const isActuallyBlocked = String(rawStatus).toUpperCase() === "BLOQUEADO";
    const statusIconClass = isTransferRelated ? 'opacity-20 cursor-not-allowed' : 'cursor-pointer hover:bg-white/10 rounded-full transition-all';

    title.innerHTML = `
        <div class="grid grid-cols-[1fr_90px_20px] items-center w-full gap-2">
            <div class="min-w-10 flex justify-start">
                <span class="text-xl font-bold text-gray-500 tracking-tight mr-4">Doc: </span>
                <span class="text-blue-400 text-2xl font-bold truncate">${row[idFieldName] || 'Detalle'}</span>
            </div>
            <div class="flex justify-center min-w-0">
                <span id="badge-status" class="text-[10px] px-2 py-0.5 rounded-full uppercase font-bold tracking-wider border truncate ${isActuallyBlocked ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-green-500/20 text-green-400 border-green-500/30'}">${rawStatus}</span>
            </div>
            <div id="status-icon-container" class="flex justify-end ${statusIconClass}" title="${isTransferRelated ? 'No se puede bloquear una transferencia' : 'Cambiar Estatus'}">
                <i data-lucide="${isActuallyBlocked ? 'lock' : 'check-circle'}" class="w-5 h-5 ${isActuallyBlocked ? 'text-red-400' : 'text-green-400'}"></i>
            </div>
        </div>`;

    Object.keys(row).forEach(key => {
            const cleanKey = key.toUpperCase();
            if (cleanKey.includes('REGISTRO') || cleanKey === idFieldName) return;
            if (cleanKey.endsWith('CUENTA2') && !isTransferRelated) return;
            if (cleanKey.includes('TYPEREG') && isTransferRelated) return;
            
            const cfg = configMap[cleanKey] || {};
            const visValue = String(cfg.visible || '').toLowerCase().trim();
            if (visValue === "") return;

            const isDescription = cleanKey.includes('DESCRIPCION');
            let isEditable = (visValue === 'x' && cfg.editable !== false && cfg.Es_Calculado !== true);
            
            if (isTransferRelated && !isDescription) isEditable = false;
            const isLockedTransferRef = cleanKey === refFieldName && valorRefActual.includes('TRANSFERENCIA');
            if (isLockedTransferRef) isEditable = false;

            const isRequired = cfg.Es_Obligatorio === true || String(cfg.Es_Obligatorio).toLowerCase() === "true";
            const asterisco = isRequired ? '<span class="text-red-500 ml-1 font-bold">*</span>' : '';
            const istoggle = cleanKey.includes('TYPEREG');
            const isDate = cleanKey.includes('FECHA') || cleanKey.includes('DATE');
            const isNumeric = cleanKey.includes('IMPORTE') || cleanKey.includes('MONTO');
            
            const dictKey = `${currentTableName}|${key}`.toUpperCase();
            const dictOptions = dictionary[dictKey];
            const isSelect = isEditable && dictOptions && dictOptions.length > 0 && (
                cleanKey.includes('MONEDA') || cleanKey.includes('MOVIMIENTO') || cleanKey.includes('TIPO') || cleanKey.endsWith('ALIASCUENTA')
            );       
            const isIdCuenta = cleanKey === `${tablePrefix}CUENTA`;

            const item = document.createElement('div');
            item.className = 'grid grid-cols-[110px_1fr] px-2 py-1 border-b border-gray-800/50 last:border-0 hover:bg-white/5 justify-items-start';
            
            let valueElement = '';
            const val = row[key] || '';

            if (!isEditable) {
                const rawValue = row[key] !== null ? row[key] : '';
                const isSpecialLock = isLockedTransferRef || (isTransferRelated && !isDescription);
                const isAliasField = cleanKey.endsWith('ALIAS'); // Identificador para el span visual
                
                valueElement = `
                    <div class="flex items-center h-[24px] px-2 py-0 w-full justify-between ${isSpecialLock ? 'bg-orange-500/5 rounded opacity-60' : 'opacity-50'}">
                        <span class="text-sm font-bold uppercase tracking-tight ${isAliasField ? 'visual-alias-span' : ''} ${isSpecialLock ? 'text-orange-400/80' : 'text-gray-500'}">
                            ${getFormattedValue(key, rawValue)}
                        </span>
                        <input type="hidden" data-field="${key}" value="${rawValue}">
                        <i data-lucide="${isSpecialLock ? 'lock-keyhole' : (cfg.Es_Calculado ? 'calculator' : 'lock')}" 
                        class="w-3.5 h-3.5 ${isSpecialLock ? 'text-orange-500/50' : 'text-gray-700'}"></i>
                    </div>`;
            } 
            else if (istoggle) {
                const isBlocked = String(row[key]).toUpperCase() === 'BLOQUEADO';
                const toggleDisabled = isTransferRelated ? 'pointer-events-none opacity-30' : '';
                valueElement = `
                    <div class="flex items-center gap-3 ${toggleDisabled}">

                            <i data-lucide="${isBlocked ? 'toggle-left' : 'toggle-right'}" class="w-6 h-6 ${isBlocked ? 'text-red-500' : 'text-green-500'} pointer-events-none"></i>
                        </button>
                        <span id="label-${key}" class="text-[11px] font-bold uppercase ${isBlocked ? 'text-red-500' : 'text-green-500'}">${isBlocked ? 'Bloqueado' : 'Registrado'}</span>
                        <input type="hidden" data-field="${key}" id="input-${key}" value="${row[key]}">
                    </div>`;
            } 
            else if (isIdCuenta) {
                valueElement = `<input type="hidden" data-field="${key}" value="${val}">`;
                item.className = 'hidden'; 
            } 
            else if (isSelect) {
                const valActual = String(val || '').trim();
                const existeEnOpciones = dictOptions.some(opt => String(opt).trim() === valActual);

                        </select>
                        <div class="absolute inset-y-0 right-2 flex items-center pointer-events-none opacity-60 group-hover:opacity-100 transition-opacity">
                            <i data-lucide="search" class="w-3.5 h-3.5" style="color: var(--p-soft);"></i>
                        </div>
                    </div>`;

            else if (isDate) {
                let dateISO = val ? (val.includes('/') ? val.split('/').reverse().join('-') : val.split('T')[0]) : '';

            else if (isNumeric) {
                valueElement = `<input type="text" data-field="${key}" data-raw="${val}" value="" placeholder="${getFormattedValue(key, val)}" onfocus="setupNumericAccounting(this)" onblur="restoreNumericFormat(this, '${key}')" oninput="applyAccountingMask(this)" class="bg-gray-800/50 border border-transparent focus:border-gray-500 rounded px-2 py-0 text-sm text-gray-100 font-bold w-full text-right focus:outline-none transition-colors placeholder:text-blue-400/60">`;
            } 
            else {
                // 1. Identificamos si es el campo de descripción
                const isDescriptionField = cleanKey.includes('DESCRIPCION');
                
                // 2. Tu configuración: Borde Rojo + Fondo Azul si es Transferencia/Descripción
                const specialStyle = (isTransferRelated && isDescriptionField) 
                    ? 'border rounded border-red-500/50 bg-blue-500/10' 
                    : 'bg-gray-800/30 border border-transparent';

                if (isDescriptionField) {
                    // 3. Placeholder solo si el valor está vacío
                    const placeholderAttr = !val ? 'placeholder="Escriba una nota o referencia aquí..."' : '';
                    
                    valueElement = `
                        <textarea data-field="${key}" rows="2" ${placeholderAttr}
                            class="${specialStyle} focus:border-red-500 rounded px-2 py-1 text-sm text-gray-100 font-bold w-full focus:outline-none transition-all resize-none placeholder:text-gray-500 placeholder:italic placeholder:font-normal uppercase">${val}</textarea>`;
                } else {
                    // 4. Lógica estándar para otros campos (como NUMERO)
                    const isNumeroCard = cleanKey.endsWith('NUMERO');
                    const onInputEvent = isNumeroCard ? 'applyCardMask(this)' : 'updateTD102Alias()';
                    const maxLengthAttr = isNumeroCard ? 'maxlength="19"' : '';

                    valueElement = `
                        <input type="text" data-field="${key}" value="${val}" 
                            oninput="${onInputEvent}" ${maxLengthAttr} 
                            class="${specialStyle} focus:border-gray-500 rounded px-2 py-0 text-sm text-gray-100 font-bold w-full focus:outline-none uppercase transition-colors">`;
                }
            }

            // Renderizado final del item
            item.innerHTML = `<span class="text-gray-200 font-medium uppercase text-[10px] self-start flex items-center">${cfg.label || key}${asterisco}</span>${valueElement}`;
            content.appendChild(item);
        });

        // Aplicar formato inicial al número si existe
        const numInput = content.querySelector(`[data-field$="NUMERO"]`);
        if (numInput && typeof applyCardMask === 'function') applyCardMask(numInput);

    if (window.lucide) lucide.createIcons();
}

        };

    const btnCancel = document.getElementById('btn-modal-cancel');
    if (btnCancel) btnCancel.onclick = () => closeDetailModal();

    const content = document.getElementById('detail-modal-content');
    const title = document.getElementById('detail-modal-title');
    
    const configMapRaw = JSON.parse(localStorage.getItem('TABLE_CONFIG') || '{}');
    const configMap = {};
    Object.keys(configMapRaw).forEach(k => {
        configMap[k.toUpperCase()] = configMapRaw[k];
    });
    
    const tablePrefix = currentTableName.split('_')[0].toUpperCase();
    const idCuentaName = `${tablePrefix}CUENTA`; // Ejemplo: TD101CUENTA
    const idPrincipalName = `${tablePrefix}ID`;   // Ejemplo: TD101ID

    content.innerHTML = '';

    // 3. TÍTULO
    title.innerHTML = `
        <div class="flex items-center justify-end w-full px-2 py-1">
            <div class="flex items-center gap-2">
                <span id="title-badge-mode" class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-blue-500/20 text-blue-400 border border-blue-500/30">
                    BORRADOR NV
                </span>
                <i data-lucide="shield-plus" class="w-5 h-5 text-blue-400"></i>
            </div>
        </div>`;

    // 4. RENDERIZADO DINÁMICO DE CAMPOS
    Object.keys(configMap).forEach(key => {
            const cfg = configMap[key]; 
            const cleanKey = key.toUpperCase();
            
            // --- REGLA DE VISIBILIDAD ---
            const visValue = String(cfg.visible || '').toLowerCase().trim();
            if (visValue === "") return;

            // --- MANEJO DE INPUTS OCULTOS REQUERIDOS POR SAVERECORD ---
            if (cleanKey === idPrincipalName || cleanKey === idCuentaName) {
                const hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.dataset.field = key; 
                hiddenInput.value = ''; 
                content.appendChild(hiddenInput);
                return; 
            }

            // --- REGLAS DE EXCLUSIÓN VISUAL RESTANTES ---
            if (cleanKey.endsWith('CUENTA2') || cleanKey.endsWith('IDOWNER') || cleanKey.includes('REGISTRO') || cleanKey.includes('TYPEREG')) return;

            const isCalculated = cfg.Es_Calculado === true || String(cfg.Es_Calculado).toLowerCase() === "calc";
            const isEditable = visValue === 'x' && cfg.editable !== false && !isCalculated;

            const isRequired = cfg.Es_Obligatorio === true || String(cfg.Es_Obligatorio).toLowerCase() === "true";
            const asterisco = isRequired ? '<span class="text-red-500 ml-1 font-bold">*</span>' : '';

            // --- LÓGICA DE SELECT (DICCIONARIO + ALIASCUENTA) ---
            const currentTableClean = String(currentTableName).trim().toUpperCase();
            const dictKey = `${currentTableClean}|${cleanKey}`;
            let dictOptions = dictionary[dictKey] || [];
            
            const isAliasField = cleanKey.endsWith('ALIASCUENTA');
            
            if (isAliasField && dictOptions.length === 0) {
                dictOptions = (window.dashboardState?.cuentas || []).map(c => c.ALIAS);
            }

            const isSelect = isEditable && dictOptions && dictOptions.length > 0 && (
                cleanKey.includes('MONEDA') || cleanKey.includes('MOVIMIENTO') || cleanKey.includes('TIPO') || isAliasField
            );

            const isDescription = cleanKey.includes('DESCRIPCION');
            const isDate = cleanKey.includes('DATE') || cleanKey.includes('FECHA');
            const isNumeric = cleanKey.includes('IMPORTE') || cleanKey.includes('MONTO');

            const rowItem = document.createElement('div');
            rowItem.className = 'grid grid-cols-[110px_1fr] gap-6 px-2 py-1 border-b border-gray-800/50 items-center hover:bg-white/5';
            
            let inputHTML = '';

            if (!isEditable) {
                const isAliasTarget = cleanKey.endsWith('ALIAS'); // Para identificar donde inyectar el alias calculado
                inputHTML = `
                    <div class="flex items-center h-[24px] px-2 w-full justify-between text-gray-500 font-bold uppercase opacity-70 text-sm">
                        <span class="truncate ${isAliasTarget ? 'visual-alias-span' : ''}">---</span>
                        <input type="hidden" data-field="${key}" value="">
                        <i data-lucide="${isCalculated ? 'calculator' : 'lock'}" class="w-3.5 h-3.5 text-gray-700"></i>
                    </div>`;

            } else if (isSelect) {
                const optionsHtml = dictOptions.map(opt => 
                    `<option value="${opt}" style="background-color: var(--bg); color: var(--txt);">${opt}</option>`
                ).join('');

                inputHTML = `
                    <div class="relative w-full group px-1">
                        <select data-field="${key}" onchange="updateTD102Alias()"
                            style="background-color: var(--bg); border-color: var(--th); color: var(--p-soft);"
                            class="border rounded px-2 py-0 text-sm font-bold w-full focus:outline-none transition-all appearance-none cursor-pointer pr-8 hover:brightness-110 shadow-sm">
                            <option value="" style="background-color: var(--bg); color: var(--txt);">-- SELECCIONE --</option>
                            ${optionsHtml}
                        </select>
                        <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none opacity-60 group-hover:opacity-100 transition-opacity">
                            <i data-lucide="search" class="w-3.5 h-3.5" style="color: var(--p-soft);"></i>
                        </div>
                    </div>`;

            } else if (isDescription) {
                inputHTML = `<textarea data-field="${key}" class="bg-gray-500/20 border border-transparent focus:border-blue-500/50 rounded px-2 py-1 text-sm text-gray-100 font-bold w-full focus:outline-none transition-colors resize-none h-[60px] uppercase"></textarea>`;

            } else if (isDate) {
                const d = new Date();
                const hoy = `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}-${d.getDate().toString().padStart(2, '0')}`;
                inputHTML = `<input type="date" data-field="${key}" value="${hoy}" class="custom-date-input bg-gray-500/20 border border-transparent focus:border-blue-500/50 rounded px-2 py-0 text-sm text-gray-100 font-bold w-full focus:outline-none transition-colors">`;
            
            } else if (isNumeric) {
                inputHTML = `<input type="text" data-field="${key}" data-raw="0" value="0,00" onfocus="this.select()" oninput="applyAccountingMask(this)" class="bg-gray-500/20 border border-transparent focus:border-blue-500/50 rounded px-2 py-0 text-sm text-gray-100 font-bold w-full focus:outline-none text-right transition-colors">`;

            } else {
                // Lógica unificada para campos de texto: NUMERO (máscara) vs OTROS (update alias)
                const isNumeroCard = cleanKey.endsWith('NUMERO');
                const onInputCall = isNumeroCard ? 'applyCardMask(this)' : 'updateTD102Alias()';
                const maxLen = isNumeroCard ? 'maxlength="19"' : '';

                inputHTML = `<input type="text" data-field="${key}" oninput="${onInputCall}" ${maxLen} class="bg-gray-500/20 border border-transparent focus:border-blue-500/50 rounded px-2 py-0 text-sm text-gray-100 font-bold w-full focus:outline-none uppercase transition-colors">`;
            }

            rowItem.innerHTML = `
                <span class="text-gray-200 font-medium uppercase text-[10px] self-start flex items-center">
                    ${cfg.label || key}${asterisco}
                </span>
                ${inputHTML}`;
                
            content.appendChild(rowItem);
        });

    if (window.lucide) lucide.createIcons();
    
    setTimeout(() => {
        const firstInput = content.querySelector('input, textarea, select');
        if (firstInput) firstInput.focus();
    }, 200);
}

function TransferAccountRecord() {
    // 1. LIMPIEZA DE DATOS Y PREPARACIÓN DEL DICCIONARIO EXPANDIDO
    const tableData = JSON.parse(localStorage.getItem('TABLE_DATA') || '{}');
    const tableOrigin = "TD101_MAIN";
    //const tableOrigin = tableData.TABLA_ORIGEN || currentTableName;
    const dictionary = JSON.parse(localStorage.getItem('VALUE_DICTIONARY') || '{}');
    
    const tableClean = String(tableOrigin).toUpperCase();
    const prefix = tableClean.split('_')[0]; 
    const dictionaryTR = { ...dictionary };

    // Inyectamos CUENTA2 en el diccionario para el select receptora
    const keyEmisora = `${tableClean}|${prefix}ALIASCUENTA`;
    const keyReceptora = `${tableClean}|${prefix}CUENTA2`;
    
    if (dictionary[keyEmisora]) {
        dictionaryTR[keyReceptora] = dictionary[keyEmisora];
    }

    localStorage.setItem('TABLE_DATA', JSON.stringify({ 
        TABLA_ORIGEN: tableOrigin,
        DATOS_REGISTRO: null 
    }));

    // 2. CONFIGURACIÓN DE INTERFAZ
    normalizeToolbar(); 
    ['Duplicar', 'Borrar', 'Nuevo', 'Editar', 'Cancelar'].forEach(disableButton);
    
    document.getElementById('btn-modal-save')?.classList.remove('hidden');
    document.getElementById('btn-modal-cancel')?.classList.remove('hidden'); 
    document.getElementById('footer-save-container')?.classList.remove('hidden');
    document.getElementById('detail-modal')?.classList.remove('hidden');

    const content = document.getElementById('detail-modal-content');
    const title = document.getElementById('detail-modal-title');
    
    const configMapRaw = JSON.parse(localStorage.getItem('TABLE_CONFIG') || '{}');
    const configMap = {};
    Object.keys(configMapRaw).forEach(k => { configMap[k.toUpperCase()] = configMapRaw[k]; });
    
    content.innerHTML = '';

    // 3. TÍTULO DE LA OPERACIÓN
    title.innerHTML = `
        <div class="flex items-center justify-end w-full px-2 py-1">
            <div class="flex items-center gap-2">
                <span id="title-badge-mode" class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-blue-500/20 text-blue-400 border border-blue-500/30">
                    BORRADOR TR
                </span>
                <i data-lucide="shield-plus" class="w-5 h-5 text-blue-400"></i>
            </div>
        </div>`;

    // 4. RENDERIZADO DINÁMICO DE CAMPOS
    Object.keys(configMap).forEach(key => {
        const cfg = configMap[key]; 
        const cleanKey = key.toUpperCase();
        
        // --- A. GESTIÓN ROBUSTA DEL ID DE CUENTA (SILENCIOSO) ---
        // Al igual que en Duplicate, necesitamos que el input exista para saveRecord
        if (cleanKey === `${prefix}CUENTA`) {
            const hiddenIdInput = document.createElement('input');
            hiddenIdInput.type = 'hidden';
            hiddenIdInput.dataset.field = key; 
            hiddenIdInput.value = ''; // Se llenará vía Alias en saveRecord
            content.appendChild(hiddenIdInput);
            return;
        }

        // --- B. FILTROS DE VISIBILIDAD Y EXCLUSIÓN ---
        const visibility = String(cfg.visible || '').toLowerCase().trim();
        if (visibility !== 'x' && visibility !== 'xx') return;
        if (cfg.Es_Calculado === true || String(cfg.Es_Calculado).toLowerCase() === "calc") return;
        if (cleanKey.endsWith('ID') || cleanKey.includes('IDOWNER')) return;
        if (cleanKey.includes('REGISTRO') && !cleanKey.includes('TYPEREG')) return;

        const isMovementField = cleanKey.includes('MOVIMIENTO');
        const isTypeRegField = cleanKey.includes('TYPEREG');
        const isReadOnly = visibility === 'xx' || cfg.editable === false;
        const isRequired = cfg.Es_Obligatorio === true || cleanKey.includes('CUENTA');
        const asterisco = isRequired && !isReadOnly ? '<span class="text-red-500 ml-1 font-bold">*</span>' : '';

        // Identificación de tipos para el renderizado
        const isDescription = cleanKey.includes('DESCRIPCION');
        const isDate = cleanKey.includes('FECHA') || cleanKey.includes('DATE');
        const isNumeric = cleanKey.includes('IMPORTE') || cleanKey.includes('MONTO');
        
        const rowItem = document.createElement('div');
        if (isTypeRegField) rowItem.className = 'hidden';
        else rowItem.className = 'grid grid-cols-[110px_1fr] gap-6 px-2 py-1 border-b border-gray-800/50 items-center hover:bg-white/5';
        
        let inputHTML = '';

        // --- C. LÓGICA DE DIBUJO ---
        if (isMovementField) {
            inputHTML = `
                <div class="flex items-center h-[24px] px-2 py-0">
                    <span class="text-sm text-blue-400 font-bold uppercase tracking-tight">TRANSFERENCIA</span>
                    <input type="hidden" data-field="${key}" value="TRANSFERENCIA">
                </div>`;
        } 
        else if (isTypeRegField) {
            inputHTML = `<input type="hidden" data-field="${key}" value="REGISTRADO">`;
        }
        else if (isReadOnly) {
            const val = cleanKey.includes('IMPORTE') || cleanKey.includes('MONTO') ? "0,00" : "";
            inputHTML = `
                <div class="flex items-center h-[24px] px-2 py-0">
                    <span class="text-sm text-gray-500 font-bold uppercase opacity-70">${val}</span>
                    <input type="hidden" data-field="${key}" value="${val}">
                </div>`;
        }
        else {
            const dictOptions = dictionaryTR[`${tableClean}|${cleanKey}`];
            const isAliasField = cleanKey.endsWith('ALIASCUENTA');
            const isCuenta2 = cleanKey.endsWith('CUENTA2');

            // --- DISEÑO SELECT RESTAURADO ---
            if (dictOptions || isAliasField || isCuenta2) {
                let optionsArray = dictOptions || [];
                // Carga de emergencia si es Alias y el diccionario está vacío
                if ((isAliasField || isCuenta2) && optionsArray.length === 0) {
                    optionsArray = (window.dashboardState?.cuentas || []).map(c => c.ALIAS);
                }

                const optionsHtml = optionsArray.map(opt => 
                    `<option value="${opt}" style="background-color: var(--bg); color: var(--txt);">${opt}</option>`
                ).join('');

                inputHTML = `
                    <div class="relative w-full group">
                        <select data-field="${key}" 
                            style="background-color: var(--bg); border-color: var(--th); color: var(--p-soft);"
                            class="border rounded px-2 py-0 text-sm font-bold w-full focus:outline-none transition-all appearance-none cursor-pointer pr-8 hover:brightness-110 shadow-sm">
                            <option value="" selected style="background-color: var(--bg); color: var(--txt);">-- SELECCIONE --</option>
                            ${optionsHtml}
                        </select>
                        <div class="absolute inset-y-0 right-2 flex items-center pointer-events-none opacity-60 group-hover:opacity-100 transition-opacity">
                            <i data-lucide="search" class="w-3.5 h-3.5" style="color: var(--p-soft);"></i>
                        </div>
                    </div>`;
            } 
            else if (cleanKey.includes('DESCRIPCION')) {
                inputHTML = `<textarea data-field="${key}" class="bg-gray-500/20 border border-transparent focus:border-blue-500/50 rounded px-2 py-1 text-sm text-gray-100 font-bold w-full focus:outline-none resize-none h-[60px]"></textarea>`;
            } 
            else if (isDate) {
                // Obtenemos la fecha local del sistema (Año-Mes-Día)
                const d = new Date();
                const year = d.getFullYear();
                const month = (d.getMonth() + 1).toString().padStart(2, '0');
                const day = d.getDate().toString().padStart(2, '0');
                
                const hoy = `${year}-${month}-${day}`; // Formato YYYY-MM-DD que requiere el input type="date"

                inputHTML = `<input type="date" data-field="${key}" value="${hoy}" class="custom-date-input bg-gray-500/20 border border-transparent focus:border-blue-500/50 rounded px-2 py-0 text-sm text-gray-100 font-bold w-full focus:outline-none transition-colors">`;
            } 
            else if (cleanKey.includes('IMPORTE') || cleanKey.includes('MONTO')) {
                inputHTML = `<input type="text" data-field="${key}" data-raw="0" value="0,00" onfocus="this.select()" oninput="applyAccountingMask(this)" class="bg-gray-500/20 border border-transparent focus:border-blue-500/50 rounded px-2 py-0 text-sm text-gray-100 font-bold w-full focus:outline-none text-right">`;
            } 
            else {
                inputHTML = `<input type="text" data-field="${key}" class="bg-gray-500/20 border border-transparent focus:border-blue-500/50 rounded px-2 py-0 text-sm text-gray-100 font-bold w-full focus:outline-none uppercase">`;
            }
        }

            rowItem.innerHTML = `
            <span class="text-gray-200 font-medium uppercase text-[10px] self-start flex items-center">
                ${cfg.label || key}${asterisco}
            </span>
            ${inputHTML}`;
            
        content.appendChild(rowItem);
    });

    if (window.lucide) lucide.createIcons();
    
    // 5. VALIDACIÓN VISUAL INTEGRAL (Simetría de errores)
    setTimeout(() => {
        const selectEmisora = content.querySelector(`[data-field$="ALIASCUENTA"]`);
        const selectReceptora = content.querySelector(`[data-field$="CUENTA2"]`);
        const selectMoneda = content.querySelector(`[data-field$="MONEDA"]`); 
        const matrizCuentas = JSON.parse(localStorage.getItem('MATRIZ_CUENTAS_USUARIO') || "[]");

        if (selectEmisora && selectReceptora && selectMoneda) {
            const validarTodoVisual = () => {
                const aliasE = selectEmisora.value?.trim();
                const aliasR = selectReceptora.value?.trim();
                const monedaReg = selectMoneda.value?.trim().toUpperCase();

                const infoE = matrizCuentas.find(c => String(c.TD102ALIAS || c.ALIAS).trim() === aliasE);
                const infoR = matrizCuentas.find(c => String(c.TD102ALIAS || c.ALIAS).trim() === aliasR);

                // --- VALIDACIÓN 1: MONEDA REGISTRO VS CUENTA ORIGEN ---
                const monedaInconsistente = infoE && monedaReg && infoE.TD102MONEDA !== monedaReg;
                
                // Aplicamos error a AMBOS campos involucrados en la moneda
                [selectEmisora, selectMoneda].forEach(el => {
                    el.style.borderColor = monedaInconsistente ? 'rgb(239 68 68)' : 'var(--th)';
                    el.style.backgroundColor = monedaInconsistente ? 'rgba(239, 68, 68, 0.05)' : 'var(--bg)';
                });

                // --- VALIDACIÓN 2: TRANSFERENCIA (CUENTA DESTINO) ---
                if (infoE && infoR) {
                    const sonIguales = (infoE.TD102ID || infoE.ID) === (infoR.TD102ID || infoR.ID);
                    const monedasTrDiff = infoE.TD102MONEDA !== infoR.TD102MONEDA;

                    const hayErrorDestino = sonIguales || monedasTrDiff;
                    
                    selectReceptora.style.borderColor = hayErrorDestino ? 'rgb(239 68 68)' : 'var(--th)';
                    selectReceptora.style.backgroundColor = hayErrorDestino ? 'rgba(239, 68, 68, 0.05)' : 'var(--bg)';
                    
                    // Si el error en la receptora es por moneda, también marcamos la moneda del registro
                    if (monedasTrDiff) {
                        selectMoneda.style.borderColor = 'rgb(239 68 68)';
                        selectMoneda.style.backgroundColor = 'rgba(239, 68, 68, 0.05)';
                    }
                }
            };

            selectEmisora.addEventListener('change', validarTodoVisual);
            selectReceptora.addEventListener('change', validarTodoVisual);
            selectMoneda.addEventListener('change', validarTodoVisual);
            
            validarTodoVisual();
        }
    }, 500);
}
       
function duplicateCurrentRecord() {
    const rawData = localStorage.getItem('TABLE_DATA');
    const dataObj = JSON.parse(rawData || '{}');
    const row = dataObj.DATOS_REGISTRO; // El registro base
    
    if (!row) return;

    // 1. CONFIGURACIÓN DE INTERFAZ
    normalizeToolbar();
    ['Duplicar', 'Borrar', 'Nuevo', 'Editar'].forEach(disableButton);
    
    document.getElementById('btn-modal-save')?.classList.remove('hidden');
    document.getElementById('btn-modal-cancel')?.classList.remove('hidden');
    document.getElementById('footer-save-container')?.classList.remove('hidden');
    document.getElementById('btn-modal-return')?.classList.add('hidden');

    const content = document.getElementById('detail-modal-content');
    const title = document.getElementById('detail-modal-title');
    const configMapRaw = JSON.parse(localStorage.getItem('TABLE_CONFIG') || '{}');
    const dictionary = JSON.parse(localStorage.getItem('VALUE_DICTIONARY') || '{}');

    // Normalización del configMap
    const configMap = {};
    Object.keys(configMapRaw).forEach(k => configMap[k.toUpperCase()] = configMapRaw[k]);

    const tablePrefix = (dataObj.TABLA_ORIGEN || currentTableName).split('_')[0].toUpperCase();
    const idFieldName = tablePrefix + 'ID';
    
    content.innerHTML = '';

    // 2. TÍTULO (Estilo Duplicado)
    title.innerHTML = `
        <div class="flex items-center justify-end w-full px-2 py-1">
            <span id="title-badge-mode" class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-yellow-500/20 text-yellow-400 border border-yellow-500/30">
                NUEVO (DUPLICADO)
            </span>
        </div>`;

    // 3. RENDERIZADO DE CAMPOS
    Object.keys(row).forEach(key => {
                const cleanKey = key.toUpperCase();
                
                // Exclusión de IDs de registro
                if (cleanKey.includes('REGISTRO') || cleanKey.includes('TYPEREG') || cleanKey === idFieldName) return;
                
                const cfg = configMap[cleanKey] || {};
                const visValue = String(cfg.visible || '').toLowerCase().trim();

                const isIdCuenta = cleanKey === `${tablePrefix}CUENTA`;
                if (visValue === "" && !isIdCuenta) return;

                const isEditable = visValue === 'x' && cfg.editable !== false && cfg.Es_Calculado !== true;
                const isRequired = cfg.Es_Obligatorio === true || String(cfg.Es_Obligatorio).toLowerCase() === "true";
                const asterisco = isRequired ? '<span class="text-red-500 ml-1 font-bold">*</span>' : '';

                const item = document.createElement('div');
                item.className = 'grid grid-cols-[110px_1fr] px-2 py-1 border-b border-gray-800/50 last:border-0 hover:bg-white/5 justify-items-start';
                
                const val = row[key] || '';
                let valueElement = '';

                if (isIdCuenta) {
                    valueElement = `<input type="hidden" data-field="${key}" value="${val}">`;
                    item.className = 'hidden'; 
                } 
                else if (!isEditable) {
                    const isAliasTarget = cleanKey.endsWith('ALIAS');
                    valueElement = `
                        <div class="flex items-center h-[24px] px-2 w-full justify-between">
                            <span class="text-sm font-bold uppercase text-gray-500 opacity-90 ${isAliasTarget ? 'visual-alias-span' : ''}">${getFormattedValue(key, val)}</span>
                            <input type="hidden" data-field="${key}" value="${val}">
                            <i data-lucide="${cfg.Es_Calculado ? 'calculator' : 'lock'}" class="w-3.5 h-3.5 text-gray-700"></i>
                        </div>`;
                } 
                else {
                    const dictKey = `${currentTableName}|${key}`.toUpperCase();
                    const dictOptions = dictionary[dictKey];
                    const isAliasField = cleanKey.endsWith('ALIASCUENTA');
                    const isSelect = dictOptions && dictOptions.length > 0 && (
                        cleanKey.includes('MONEDA') || cleanKey.includes('MOVIMIENTO') || cleanKey.includes('TIPO') || isAliasField
                    );

                    if (isSelect) {
                        const valActual = String(val || '').trim();
                        let options = dictOptions || [];
                        
                        if (isAliasField && options.length === 0) {
                            options = (window.dashboardState?.cuentas || []).map(c => c.ALIAS);
                        }

                        const existeEnOpciones = options.some(opt => String(opt).trim() === valActual);
                        const optionsHtml = options.map(opt => {
                            const isSelected = String(opt).trim() === valActual;
                            return `<option value="${opt}" ${isSelected ? 'selected' : ''} style="background-color: var(--bg); color: var(--txt);">${opt}</option>`;
                        }).join('');

                        valueElement = `
                            <div class="relative w-full group">
                                <select data-field="${key}" onchange="updateTD102Alias()"
                                    class="bg-transparent border border-gray-700 rounded px-2 py-0 text-sm font-bold w-full focus:outline-none appearance-none cursor-pointer pr-8 shadow-sm">
                                    ${!existeEnOpciones ? `<option value="${valActual}" selected>${valActual || '-- SELECCIONE --'}</option>` : ''}
                                    ${optionsHtml}
                                </select>
                                <div class="absolute inset-y-0 right-2 flex items-center pointer-events-none opacity-60">
                                    <i data-lucide="search" class="w-3.5 h-3.5"></i>
                                </div>
                            </div>`;
                    } else if (cleanKey.includes('FECHA') || cleanKey.includes('DATE')) {
                        let dateISO = val.includes('/') ? val.split('/').reverse().join('-') : (val.includes('T') ? val.split('T')[0] : val);
                        valueElement = `<input type="date" data-field="${key}" value="${dateISO}" class="bg-gray-800/50 border border-transparent focus:border-gray-500 rounded px-2 py-0 text-sm text-gray-100 font-bold w-full focus:outline-none">`;
                    } else if (cleanKey.includes('IMPORTE') || cleanKey.includes('MONTO')) {
                        valueElement = `<input type="text" data-field="${key}" data-raw="${val}" value="${getFormattedValue(key, val)}" onfocus="this.select()" oninput="applyAccountingMask(this)" class="bg-gray-800/50 border border-transparent focus:border-gray-500 rounded px-2 py-0 text-sm text-gray-100 font-bold w-full text-right focus:outline-none">`;
                    } else if (cleanKey.includes('DESCRIPCION')) {
                        valueElement = `<textarea data-field="${key}" class="bg-gray-800/30 border border-transparent focus:border-gray-500 rounded px-2 py-1 text-sm text-gray-100 font-bold w-full focus:outline-none resize-none h-[60px] uppercase">${val}</textarea>`;
                    } else {
                        // Lógica para campos de texto: NUMERO (máscara) vs OTROS (update alias)
                        const isNumeroCard = cleanKey.endsWith('NUMERO');
                        const onInputCall = isNumeroCard ? 'applyCardMask(this)' : 'updateTD102Alias()';
                        const maxLen = isNumeroCard ? 'maxlength="19"' : '';

                        valueElement = `<input type="text" data-field="${key}" value="${val}" oninput="${onInputCall}" ${maxLen} class="bg-gray-800/30 border border-transparent focus:border-gray-500 rounded px-2 py-0 text-sm text-gray-100 font-bold w-full focus:outline-none uppercase">`;
                    }
                }

                item.innerHTML = `<span class="text-gray-200 font-medium uppercase text-[10px] self-start flex items-center">${cfg.label || key}${asterisco}</span>${valueElement}`;
                content.appendChild(item);
            });

            // Aplicar máscara inicial al duplicar si el registro base ya tenía un número
            const numInput = content.querySelector(`[data-field$="NUMERO"]`);
            if (numInput && typeof applyCardMask === 'function') applyCardMask(numInput);

            if (window.lucide) lucide.createIcons();
            if (typeof updateTD102Alias === 'function') updateTD102Alias();

    if (window.lucide) lucide.createIcons();
    
    // Ejecutamos una actualización inicial por si el registro duplicado requiere recalcular el Alias
    if (typeof updateTD102Alias === 'function') updateTD102Alias();
}
</script>

</body>
</html>
