<script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbySY71ObLBUZeO9LwdOkH1Qh5Mmv-V-uws_Yvz_cN8L51baFWm9WgloRBCzteqBRCUi/exec';
    let dashboardData = { balance: 0, ingresos: 0, egresos: 0, operaciones: 0, cuentas: [] };
    let cuentasDesplegadas = false;
    let cuentaSeleccionada = null;

document.addEventListener('DOMContentLoaded', () => {
    applyTheme();

    } else {

});

    function toggleMaskedValue(valueId, actualValue, show, iconId) {
        const valueElement = document.getElementById(valueId);
        const iconElement = document.getElementById(iconId); 
        if (valueElement) {
            if (show) { valueElement.textContent = actualValue; if (iconElement) iconElement.style.opacity = '0';
            } else { valueElement.textContent = '••••••'; if (iconElement) iconElement.style.opacity = '1'; }
        }
    }

        function initUI(){
        const nom = localStorage.getItem(KEYS.NOMBRE);
        if(nom) document.querySelector('h1').textContent = `¡Hola, ${nom.trim().split(/\s+/)[0]}!`;
        adjustLayoutForOrientation();
        document.querySelectorAll('.footer-btn').forEach(b => {
            const section = b.getAttribute('data-section');
            b.onclick = () => {
                const NAV = {'Base': 'Base_SPA1.html', 'Datos': 'SPA1.html', 'Resumen': 'Resumen_SPA1.html', 'Perfil': 'PerfilUser_SPA1.html'};
                if (NAV[section]) window.location.href = NAV[section];
            };
            if (section === 'Resumen') { b.classList.add('active'); } else { b.classList.remove('active');
            }
        });
        if (window.lucide) lucide.createIcons();
    }

    function adjustLayoutForOrientation() {
        const container = document.getElementById('app-container');
        if (!container) return;
        const isDesktop = window.innerWidth > window.innerHeight;
        const mode = isDesktop ? 'desktop' : 'mobile';   
        localStorage.setItem(KEYS.VIEW_MODE, mode);
        applyViewMode(mode);
    }

    function toggleView() {
        const m = localStorage.getItem(KEYS.VIEW_MODE) === 'desktop' ? 'mobile' : 'desktop';
        localStorage.setItem(KEYS.VIEW_MODE, m);
        applyViewMode(m);
    }

    function applyViewMode(m) {
        const c = document.getElementById('app-container'), i = document.getElementById('view-icon-container');
        if (!c || !i) return;      
        c.classList.toggle('mode-desktop', m === 'desktop');
        c.classList.toggle('mode-mobile', m !== 'desktop');     
        i.innerHTML = m === 'desktop' 
            ? '<i data-lucide="smartphone" class="w-5 h-5 text-blue-400"></i>' 
            : '<i data-lucide="monitor" class="w-5 h-5 text-emerald-400"></i>';          
        if (window.lucide) lucide.createIcons();
    }

    window.addEventListener('resize', adjustLayoutForOrientation);

    // FORMATEO DE DATOS
    function formatDate(v) {
        if (!v) return 'N/A';
        const d = new Date(v);
        if (isNaN(d.getTime())) return v;
        const day = d.getUTCDate().toString().padStart(2, '0');
        const month = (d.getUTCMonth() + 1).toString().padStart(2, '0');
        return `${day}/${month}/${d.getUTCFullYear()}`;
    }
    function formatDateTime(v) {
        if (!v) return 'N/A';
        const d = new Date(v);
        if (isNaN(d.getTime())) return v;
        const datePart = formatDate(v);
        const timePart = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        return `${datePart} ${timePart}`;
    }

    function getFormattedValue(key, value) {
        // 1. Manejo de nulos o vacíos
        if (value === null || value === undefined || value === '') return '';        
        
        const cleanKey = String(key).toUpperCase();
        let stringValue = String(value).trim();

        // 2. Normalización de guiones
        if (stringValue === '-') stringValue = '0';

        // 3. EXCEPCIONES DE TEXTO (Configuración y EO)
        if (cleanKey.endsWith('CONFIG')) {
            return stringValue.replace(/([spdf])(\d+)/g, '$1<sup>$2</sup>');
        }
        if (cleanKey.substring(5, 7) === 'EO') return stringValue;

        // 4. TRATAMIENTO DE IDs Y USUARIOS
        if (cleanKey.endsWith('ID') || cleanKey.includes('REGISTROUSER')) return stringValue;

        // 5. FECHAS Y HORAS (Restaurado a tu lógica original)
        if (cleanKey.includes('REGISTRODATA')) return formatDateTime(value);
        if (cleanKey.includes('FECHA')) return formatDate(value);
        
        // 6. TRATAMIENTO NUMÉRICO (Corrección quirúrgica aquí)
        // Antes de pasar por parseFloat, verificamos si es un código alfanumérico (letras + números)
        const esAlfanumerico = /[a-zA-Z]/.test(stringValue) && /\d/.test(stringValue);
        
        if (esAlfanumerico) return stringValue; // Si es ZX4000X, sale aquí intacto.

        const numValue = parseFloat(stringValue.replace(',', '.'));

        if (!isNaN(numValue) && isFinite(numValue)) {
            const formatOptions = { useGrouping: true, style: 'decimal' };
            
            if (cleanKey.endsWith('MONTOML2') || cleanKey.includes('TASAREF')) {
                return new Intl.NumberFormat('es-ES', { 
                    ...formatOptions, 
                    minimumFractionDigits: 2, 
                    maximumFractionDigits: 5 
                }).format(numValue);
            }

            if (cleanKey.includes('IMPORTE') || cleanKey.includes('MONTO')) {
                return new Intl.NumberFormat('es-ES', { 
                    ...formatOptions, 
                    minimumFractionDigits: 2, 
                    maximumFractionDigits: 2 
                }).format(numValue);
            }

            return new Intl.NumberFormat('es-ES', { 
                ...formatOptions, 
                minimumFractionDigits: (numValue === 0 ? 2 : 0), 
                maximumFractionDigits: 2 
            }).format(numValue);
        }

        return value;
    }
   
    function toggleGlobalLoader(show, title = "Actualizando", desc = "Sincronizando") {
        const loader = document.getElementById('global-loader');
        if (!loader) return;

        const loaderTitle = loader.querySelector('span');
        const loaderDesc = loader.querySelector('p');
        
        if (show) {
            if (loaderTitle) loaderTitle.textContent = title;
            if (loaderDesc) loaderDesc.innerHTML = desc;
            loader.classList.remove('hidden');
        } else {
            loader.classList.add('hidden');
            // Resetear tras el delay para que la próxima función no herede textos viejos y tome los valores por defecto (HTML)
            setTimeout(() => {
                if (loaderTitle) loaderTitle.textContent = "Actualizando";
                if (loaderDesc) loaderDesc.innerHTML = "Sincronizando";
            }, 300);
        }
    }

    // FETCH Y CARGA DE TABLAS
async function fetchDashboardData() {
    toggleGlobalLoader(true, "Sincronizando Resumen...", "Obteniendo saldos y cuentas");
    
    const userTienda = localStorage.getItem(KEYS.TIENDA) || 'DEFAULT';
    // Usamos la acción unificada que creamos en el backend
    const url = `${GAS_URL}?action=getDashboardSummary&userTienda=${encodeURIComponent(userTienda)}`;

    try {
        const response = await fetch(url);
        const res = await response.json();

        if (res.success) {
            // Guardamos los datos brutos en nuestro estado global
            // Nota: Cambié dashboardData por dashboardState para consistencia con tu lógica de filtrado
            window.dashboardState = {
                operaciones: res.operaciones || [],
                cuentas: res.cuentas || []
            };

            // Actualizamos la lista de cuentas para el renderizado de sub-tarjetas
            dashboardData.cuentas = res.cuentas || [];

            // Calculamos métricas iniciales (de todas las cuentas)
            updateDashboardMetrics(null);
            
            // Actualizamos el contador de la 4ta tarjeta
            document.getElementById('dash-cant-cuentas').textContent = dashboardData.cuentas.length;
        }
    } catch (err) {
        console.error("Error en Dashboard Fetch:", err);
    } finally {
        toggleGlobalLoader(false);
    }
}

function toggleCuentasDetalle() {
    const container = document.getElementById('cuentas-detalle-container');
    const icon = document.getElementById('icon-chevron-cuentas');
    
    cuentasDesplegadas = !cuentasDesplegadas;

    if (cuentasDesplegadas) {
        container.classList.remove('hidden');
        icon.style.transform = 'rotate(180deg)';
        renderSubCuentas();
    } else {
        container.classList.add('hidden');
        icon.style.transform = 'rotate(0deg)';
    }
}

function renderSubCuentas() {
    const container = document.getElementById('cuentas-detalle-container');
    if (!container) return;
    
    container.innerHTML = ''; // Limpiar panel

    if (!dashboardData.cuentas || dashboardData.cuentas.length === 0) {
        container.innerHTML = `
            <div class="flex flex-col items-center justify-center py-6 opacity-50">
                <i data-lucide="layers" class="w-6 h-6 mb-2 text-gray-500"></i>
                <p class="text-gray-500 text-[10px] uppercase tracking-[0.2em]">Sin cuentas registradas</p>
            </div>
        `;
        if (window.lucide) lucide.createIcons();
        return;
    }

    // --- OPCIÓN: TODOS LOS REGISTROS (VISTA GLOBAL) ---
    const esGlobal = (cuentaSeleccionada === null || cuentaSeleccionada === "TODAS");
    const btnGlobal = `
        <div onclick="updateDashboardMetrics(null)" 
             class="group cursor-pointer transition-all duration-300 p-3 rounded-xl border flex justify-between items-center mb-4
             ${esGlobal ? 'bg-emerald-500/10 border-emerald-500/40 shadow-lg shadow-emerald-900/20' : 'bg-gray-800/30 border-gray-700/50 hover:border-gray-600'}">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center ${esGlobal ? 'bg-emerald-500/20' : 'bg-gray-700/50 group-hover:bg-gray-700'}">
                    <i data-lucide="layout-grid" class="w-4 h-4 ${esGlobal ? 'text-emerald-400' : 'text-gray-500'}"></i>
                </div>
                <div class="flex flex-col">
                    <span class="${esGlobal ? 'text-emerald-400 font-bold' : 'text-gray-300'} text-xs tracking-tight">VISTA GLOBAL</span>
                    <span class="text-[9px] text-gray-500 uppercase tracking-tighter">Consolidado de todas las cuentas</span>
                </div>
            </div>
            ${esGlobal ? '<div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>' : ''}
        </div>
        <div class="px-2 mb-3">
            <p class="text-[9px] text-gray-500 font-bold uppercase tracking-[0.15em]">Seleccionar Cuenta Específica</p>
        </div>
    `;
    container.insertAdjacentHTML('beforeend', btnGlobal);

    // --- LISTADO DE SELECTORES DE CUENTA ---
    dashboardData.cuentas.forEach((cuenta, index) => {
        const nombreCta = (cuenta.NOMBRE || cuenta.CUENTA || 'Sin nombre').trim();
        const estaSeleccionada = (cuentaSeleccionada === nombreCta);
        
        const html = `
            <div onclick="updateDashboardMetrics('${nombreCta}')" 
                 class="group cursor-pointer transition-all duration-300 p-3 rounded-xl border flex justify-between items-center mb-2 animate-fade-in
                 ${estaSeleccionada ? 'bg-purple-600/20 border-purple-500/50 shadow-lg shadow-purple-900/20' : 'bg-gray-800/40 border-gray-700/50 hover:bg-gray-800/70 hover:border-gray-600'}"
                 style="animation-delay: ${index * 30}ms">
                
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center transition-colors
                        ${estaSeleccionada ? 'bg-purple-500/30' : 'bg-gray-900/50 group-hover:bg-gray-900'}">
                        <i data-lucide="wallet" class="w-4 h-4 ${estaSeleccionada ? 'text-purple-400' : 'text-gray-600 group-hover:text-gray-400'}"></i>
                    </div>
                    
                    <div class="flex flex-col">
                        <span class="${estaSeleccionada ? 'text-white font-bold' : 'text-gray-300'} text-sm tracking-tight">
                            ${nombreCta}
                        </span>
                        <span class="text-[9px] text-gray-500 font-mono">
                            ${cuenta.ID || 'S/ID'}
                        </span>
                    </div>
                </div>

                <div class="flex items-center">
                    ${estaSeleccionada ? 
                        '<i data-lucide="check-circle-2" class="w-5 h-5 text-purple-400"></i>' : 
                        '<i data-lucide="chevron-right" class="w-4 h-4 text-gray-700 group-hover:text-gray-500 group-hover:translate-x-1 transition-all"></i>'
                    }
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
    });

    if (window.lucide) lucide.createIcons();
}

/**
 * Filtra y actualiza las tarjetas del dashboard
 * @param {string|null} cuenta - El nombre o ID de la cuenta a filtrar
 */
function updateDashboardMetrics(cuenta = null) {
    cuentaSeleccionada = cuenta;
    
    if (!window.dashboardState || !window.dashboardState.operaciones) return;

    // 1. Filtrar primero por cuenta (si aplica)
    let opsBase = (cuenta === null || cuenta === "TODAS") 
        ? window.dashboardState.operaciones 
        : window.dashboardState.operaciones.filter(op => String(op.CUENTA).trim() === String(cuenta).trim());

    let ingresos = 0;
    let egresos = 0;
    let contadorOperaciones = 0;

    opsBase.forEach(op => {
        const monto = parseFloat(String(op.MONTO || 0).replace(',', '.'));
        const movimiento = String(op.MOVIMIENTO || '').toUpperCase().trim();
        const typeReg = String(op.TYPEREG || '').toLowerCase().trim();

        // REGLA: CRÉDITO = Ingreso, DÉBITO = Egreso
        if (movimiento === 'CRÉDITO') {
            ingresos += monto;
        } else if (movimiento === 'DÉBITO') {
            egresos += monto;
        }

        // REGLA: Cantidad de operaciones solo donde TYPEREG == "registrados"
        if (typeReg === 'registrados') {
            contadorOperaciones++;
        }
    });

    const balance = ingresos - egresos;

    // Actualizar UI con formato
    animateValue('dash-main-balance', balance, true);
    animateValue('dash-ingresos', ingresos, true);
    animateValue('dash-egresos', egresos, true);
    animateValue('dash-operaciones', contadorOperaciones, false);

    // Refrescar lista de cuentas para marcar la seleccionada
    if (cuentasDesplegadas) renderSubCuentas();
}

/**
 * Función auxiliar para formatear y mostrar valores
 */
function animateValue(id, value, isCurrency) {
    const element = document.getElementById(id);
    if (!element) return;
    
    // Si es moneda, forzamos el formato 'MONTO' que aplica Intl.NumberFormat es-ES con 2 decimales
    // Si no es moneda (ej. Total Operaciones), usamos un formato genérico o directo
    const formatted = isCurrency 
        ? `$ ${getFormattedValue('MONTO', value)}` 
        : getFormattedValue('CANTIDAD', value); 
    
    element.textContent = formatted;
}

</script>
