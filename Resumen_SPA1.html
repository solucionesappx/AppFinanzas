<script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbySY71ObLBUZeO9LwdOkH1Qh5Mmv-V-uws_Yvz_cN8L51baFWm9WgloRBCzteqBRCUi/exec';
    let dashboardData = { balance: 0, ingresos: 0, egresos: 0, operaciones: 0, cuentas: [] };
    let cuentasDesplegadas = false;
    let cuentaSeleccionada = null;

document.addEventListener('DOMContentLoaded', () => {
    applyTheme();
    if(!localStorage.getItem(KEYS.CORREO)) {
        window.location.replace('index.html');
    } else {
        initUI();
        // Llamada inicial para llenar las tarjetas
        fetchDashboardData(); 
    }
    if(window.lucide) lucide.createIcons();
});

    function toggleMaskedValue(valueId, actualValue, show, iconId) {
        const valueElement = document.getElementById(valueId);
        const iconElement = document.getElementById(iconId); 
        if (valueElement) {
            if (show) { valueElement.textContent = actualValue; if (iconElement) iconElement.style.opacity = '0';
            } else { valueElement.textContent = '••••••'; if (iconElement) iconElement.style.opacity = '1'; }
        }
    }

        function initUI(){
        const nom = localStorage.getItem(KEYS.NOMBRE);
        if(nom) document.querySelector('h1').textContent = `¡Hola, ${nom.trim().split(/\s+/)[0]}!`;
        adjustLayoutForOrientation();
        document.querySelectorAll('.footer-btn').forEach(b => {
            const section = b.getAttribute('data-section');
            b.onclick = () => {
                const NAV = {'Base': 'Base_SPA1.html', 'Datos': 'SPA1.html', 'Resumen': 'Resumen_SPA1.html', 'Perfil': 'PerfilUser_SPA1.html'};
                if (NAV[section]) window.location.href = NAV[section];
            };
            if (section === 'Resumen') { b.classList.add('active'); } else { b.classList.remove('active');
            }
        });
        if (window.lucide) lucide.createIcons();
    }

    function adjustLayoutForOrientation() {
        const container = document.getElementById('app-container');
        if (!container) return;
        const isDesktop = window.innerWidth > window.innerHeight;
        const mode = isDesktop ? 'desktop' : 'mobile';   
        localStorage.setItem(KEYS.VIEW_MODE, mode);
        applyViewMode(mode);
    }

    function toggleView() {
        const m = localStorage.getItem(KEYS.VIEW_MODE) === 'desktop' ? 'mobile' : 'desktop';
        localStorage.setItem(KEYS.VIEW_MODE, m);
        applyViewMode(m);
    }

    function applyViewMode(m) {
        const c = document.getElementById('app-container'), i = document.getElementById('view-icon-container');
        if (!c || !i) return;      
        c.classList.toggle('mode-desktop', m === 'desktop');
        c.classList.toggle('mode-mobile', m !== 'desktop');     
        i.innerHTML = m === 'desktop' 
            ? '<i data-lucide="smartphone" class="w-5 h-5 text-blue-400"></i>' 
            : '<i data-lucide="monitor" class="w-5 h-5 text-emerald-400"></i>';          
        if (window.lucide) lucide.createIcons();
    }

    window.addEventListener('resize', adjustLayoutForOrientation);

    // FORMATEO DE DATOS
    function formatDate(v) {
        if (!v) return 'N/A';
        const d = new Date(v);
        if (isNaN(d.getTime())) return v;
        const day = d.getUTCDate().toString().padStart(2, '0');
        const month = (d.getUTCMonth() + 1).toString().padStart(2, '0');
        return `${day}/${month}/${d.getUTCFullYear()}`;
    }
    function formatDateTime(v) {
        if (!v) return 'N/A';
        const d = new Date(v);
        if (isNaN(d.getTime())) return v;
        const datePart = formatDate(v);
        const timePart = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        return `${datePart} ${timePart}`;
    }

    function getFormattedValue(key, value) {
        // 1. Manejo de nulos o vacíos
        if (value === null || value === undefined || value === '') return '';        
        
        const cleanKey = String(key).toUpperCase();
        let stringValue = String(value).trim();

        // 2. Normalización de guiones
        if (stringValue === '-') stringValue = '0';

        // 3. EXCEPCIONES DE TEXTO (Configuración y EO)
        if (cleanKey.endsWith('CONFIG')) {
            return stringValue.replace(/([spdf])(\d+)/g, '$1<sup>$2</sup>');
        }
        if (cleanKey.substring(5, 7) === 'EO') return stringValue;

        // 4. TRATAMIENTO DE IDs Y USUARIOS
        if (cleanKey.endsWith('ID') || cleanKey.includes('REGISTROUSER')) return stringValue;

        // 5. FECHAS Y HORAS (Restaurado a tu lógica original)
        if (cleanKey.includes('REGISTRODATA')) return formatDateTime(value);
        if (cleanKey.includes('FECHA')) return formatDate(value);
        
        // 6. TRATAMIENTO NUMÉRICO (Corrección quirúrgica aquí)
        // Antes de pasar por parseFloat, verificamos si es un código alfanumérico (letras + números)
        const esAlfanumerico = /[a-zA-Z]/.test(stringValue) && /\d/.test(stringValue);
        
        if (esAlfanumerico) return stringValue; // Si es ZX4000X, sale aquí intacto.

        const numValue = parseFloat(stringValue.replace(',', '.'));

        if (!isNaN(numValue) && isFinite(numValue)) {
            const formatOptions = { useGrouping: true, style: 'decimal' };
            
            if (cleanKey.endsWith('MONTOML2') || cleanKey.includes('TASAREF')) {
                return new Intl.NumberFormat('es-ES', { 
                    ...formatOptions, 
                    minimumFractionDigits: 2, 
                    maximumFractionDigits: 5 
                }).format(numValue);
            }

            if (cleanKey.includes('IMPORTE') || cleanKey.includes('MONTO')) {
                return new Intl.NumberFormat('es-ES', { 
                    ...formatOptions, 
                    minimumFractionDigits: 2, 
                    maximumFractionDigits: 2 
                }).format(numValue);
            }

            return new Intl.NumberFormat('es-ES', { 
                ...formatOptions, 
                minimumFractionDigits: (numValue === 0 ? 2 : 0), 
                maximumFractionDigits: 2 
            }).format(numValue);
        }

        return value;
    }
   
    function toggleGlobalLoader(show, title = "Actualizando", desc = "Sincronizando") {
        const loader = document.getElementById('global-loader');
        if (!loader) return;

        const loaderTitle = loader.querySelector('span');
        const loaderDesc = loader.querySelector('p');
        
        if (show) {
            if (loaderTitle) loaderTitle.textContent = title;
            if (loaderDesc) loaderDesc.innerHTML = desc;
            loader.classList.remove('hidden');
        } else {
            loader.classList.add('hidden');
            // Resetear tras el delay para que la próxima función no herede textos viejos y tome los valores por defecto (HTML)
            setTimeout(() => {
                if (loaderTitle) loaderTitle.textContent = "Actualizando";
                if (loaderDesc) loaderDesc.innerHTML = "Sincronizando";
            }, 300);
        }
    }

    // FETCH Y CARGA DE TABLAS
async function fetchDashboardData() {
    toggleGlobalLoader(true, "Sincronizando Resumen...", "Obteniendo saldos y cuentas");
    
    const userTienda = localStorage.getItem(KEYS.TIENDA) || 'DEFAULT';
    const usuarioId = localStorage.getItem('Usuario_ID');
    const perfil = localStorage.getItem(KEYS.PERFIL);
    const tiendaId = localStorage.getItem(KEYS.TIENDA_ID); 

    const url = `${GAS_URL}?action=getDashboardSummary` +
                `&userTienda=${encodeURIComponent(userTienda)}` +
                `&tiendaId=${encodeURIComponent(tiendaId)}` + 
                `&usuarioId=${encodeURIComponent(usuarioId)}` +
                `&perfil=${encodeURIComponent(perfil)}`;

    try {
        const response = await fetch(url);
        const res = await response.json();

        if (res.success) {
            // 1. Guardar en RAM (Estructura: ID, ALIAS...)
            window.dashboardState = {
                operaciones: res.operaciones || [],
                cuentas: res.cuentas || []
            };

            // 2. GUARDAR EN STORAGE (Estructura: TD102ID, TD102ALIAS...)
            // Normalizamos aquí para que la SPA que envía datos no falle
            const matrizParaStorage = (res.cuentas || []).map(c => ({
                TD102ID: c.ID,
                TD102NUMERO: c.NUMERO,
                TD102ALIAS: c.ALIAS,
                TD102MONEDA: c.MONEDA,
                TD102BANCO: c.BANCO || '' // Si el dashboard trae banco, lo incluimos
            }));

            localStorage.setItem('MATRIZ_CUENTAS_USUARIO', JSON.stringify(matrizParaStorage));

            // 3. Actualizar UI
            dashboardData.cuentas = res.cuentas || [];
            updateDashboardMetrics(null);
            
            const countEl = document.getElementById('dash-cant-cuentas');
            if (countEl) countEl.textContent = dashboardData.cuentas.length;

            console.log("✅ Datos sincronizados en RAM y Storage (Formato TD102)");
        }
    } catch (err) {
        console.error("❌ Error fetchDashboardData:", err);
    } finally {
        toggleGlobalLoader(false);
    }
}

function toggleCuentasDetalle() {
    const container = document.getElementById('cuentas-detalle-container');
    const icon = document.getElementById('icon-chevron-cuentas');
    
    cuentasDesplegadas = !cuentasDesplegadas;

    if (cuentasDesplegadas) {
        container.classList.remove('hidden');
        icon.style.transform = 'rotate(180deg)';
        renderSubCuentas();
    } else {
        container.classList.add('hidden');
        icon.style.transform = 'rotate(0deg)';
    }
}

function renderSubCuentas() {
    const container = document.getElementById('cuentas-detalle-container');
    if (!container) return;
    container.innerHTML = ''; 

    const esGlobal = (cuentaSeleccionada === null || cuentaSeleccionada === "TODAS");
    
    const btnGlobal = `
        <div onclick="updateDashboardMetrics('TODAS')" 
             class="group cursor-pointer transition-all duration-300 p-3 rounded-xl border flex justify-between items-center mb-4
             ${esGlobal ? 'bg-emerald-500/10 border-emerald-500/40' : 'bg-gray-800/30 border-gray-700/50 hover:border-gray-600'}">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center ${esGlobal ? 'bg-emerald-500/20' : 'bg-gray-700/50'}">
                    <i data-lucide="layout-grid" class="w-4 h-4 ${esGlobal ? 'text-emerald-400' : 'text-gray-500'}"></i>
                </div>
                <div class="flex flex-col">
                    <span class="${esGlobal ? 'text-emerald-400 font-bold' : 'text-gray-300'} text-xs uppercase">Vista Global</span>
                </div>
            </div>
            ${esGlobal ? '<div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>' : ''}
        </div>`;
    
    container.insertAdjacentHTML('beforeend', btnGlobal);

    // Listado de cuentas (Igual al tuyo)
    window.dashboardState.cuentas.forEach((cuenta, index) => {
        const estaSeleccionada = (String(cuentaSeleccionada) === String(cuenta.ID));
        const html = `
            <div onclick="updateDashboardMetrics('${cuenta.ID}')" 
                 class="group cursor-pointer transition-all duration-300 p-3 rounded-xl border flex justify-between items-center mb-2
                 ${estaSeleccionada ? 'bg-purple-600/20 border-purple-500/50 shadow-lg' : 'bg-gray-800/40 border-gray-700/50 hover:bg-gray-800/70'}">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center ${estaSeleccionada ? 'bg-purple-500/30' : 'bg-gray-900/50'}">
                        <i data-lucide="wallet" class="w-4 h-4 ${estaSeleccionada ? 'text-purple-400' : 'text-gray-600'}"></i>
                    </div>
                    <div class="flex flex-col text-left">
                        <span class="${estaSeleccionada ? 'text-white font-bold' : 'text-gray-300'} text-[11px] uppercase">${cuenta.ALIAS}</span>
                        <span class="text-[9px] text-gray-500 font-mono">${cuenta.NUMERO}</span>
                    </div>
                </div>
                ${estaSeleccionada ? '<i data-lucide="check-circle-2" class="w-4 h-4 text-purple-400"></i>' : '<i data-lucide="chevron-right" class="w-4 h-4 text-gray-700"></i>'}
            </div>`;
        container.insertAdjacentHTML('beforeend', html);
    });

    if (window.lucide) lucide.createIcons();
}

function updateDashboardMetrics(cuenta = null) {
    // 1. Normalización de la selección
    cuentaSeleccionada = (cuenta === "TODAS" || cuenta === null) ? null : cuenta;
    
    if (!window.dashboardState || !window.dashboardState.operaciones) return;

    // Inicializar el filtro de moneda global si no existe
    if (!window.monedaGlobalFiltro) window.monedaGlobalFiltro = "VED";

    const ops = window.dashboardState.operaciones;
    const cuentas = window.dashboardState.cuentas;
    let simboloMoneda = "";

    // 2. Lógica de Moneda y Control del Selector Visual
    const selectorCont = document.getElementById('global-currency-selector');
    
    if (cuentaSeleccionada) {
        // VISTA DE CUENTA ESPECÍFICA
        if (selectorCont) selectorCont.classList.add('hidden');
        const infoCta = cuentas.find(c => String(c.ID).trim() === String(cuentaSeleccionada).trim());
        simboloMoneda = infoCta ? infoCta.MONEDA : "VED";
    } else {
        // VISTA GLOBAL
        if (selectorCont) {
            selectorCont.classList.remove('hidden');
            renderGlobalCurrencyButtons(); // <--- Aquí es donde se refrescan los botones
        }
        simboloMoneda = window.monedaGlobalFiltro;
    }

    // 3. Filtrado de Operaciones (Ajustado para IDs y Alias)
    let filtered = [];
    if (cuentaSeleccionada) {
        // Filtrar solo por el ID de la cuenta (buscamos en op.CUENTA que ahora es el ID)
        filtered = ops.filter(op => String(op.CUENTA).trim() === String(cuentaSeleccionada).trim());
    } else {
        // VISTA GLOBAL: Buscamos la moneda de la cuenta relacionada
        filtered = ops.filter(op => {
            // Buscamos la info de la cuenta ya sea por el ID (op.CUENTA) o por el ALIAS (op.ALIAS_CUENTA)
            const infoCta = cuentas.find(c => 
                String(c.ID).trim() === String(op.CUENTA).trim() || 
                (op.ALIAS_CUENTA && String(c.ALIAS).trim().toUpperCase() === String(op.ALIAS_CUENTA).trim().toUpperCase())
            );
            return infoCta && infoCta.MONEDA === simboloMoneda;
        });
    }

    // 4. Sumatoria y Conteo
    let ingresos = 0;
    let egresos = 0;
    let contadorOperaciones = 0;

    filtered.forEach(row => {
        const status = String(row.TYPEREG || '').toLowerCase();
        if (status.includes('bloqueado')) return; // Seguridad extra

        const monto = parseFloat(row.IMPORTE) || 0;
        const mov = String(row.MOVIMIENTO || '').toUpperCase().trim();

        // Soportamos todos los términos de movimiento
        if (['INGRESO', 'CRÉDITO', 'CREDITO'].includes(mov)) {
            ingresos += monto;
        } else if (['EGRESO', 'DÉBITO', 'DEBITO'].includes(mov)) {
            egresos += monto;
        }

        if (status.includes('registrado')) {
            contadorOperaciones++;
        }
    });

    const balance = ingresos - egresos;

    // 5. Renderizado de Etiquetas de Moneda
    ['dash-main-coin', 'dash-ingresos-coin', 'dash-egresos-coin'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = simboloMoneda;
    });

    // 6. Renderizado de Valores Numéricos
    animateValue('dash-main-balance', balance, true);
    animateValue('dash-ingresos', ingresos, true);
    animateValue('dash-egresos', egresos, true);
    animateValue('dash-operaciones', contadorOperaciones, false);

    // 7. Color dinámico del balance
    const mainBalanceEl = document.getElementById('dash-main-balance');
    if (mainBalanceEl) {
        mainBalanceEl.classList.remove('text-emerald-400', 'text-red-400', 'text-white');
        if (Math.abs(balance) < 0.01) {
            mainBalanceEl.classList.add('text-white');
        } else {
            mainBalanceEl.classList.add(balance < 0 ? 'text-red-400' : 'text-emerald-400');
        }
    }

    // 8. Actualizar lista de subcuentas
    if (typeof renderSubCuentas === 'function') {
        renderSubCuentas();
    }
}

function renderGlobalCurrencyButtons() {
    const container = document.getElementById('global-currency-selector');
    if (!container) return;

    // Las monedas que definiste
    const monedas = ["USD", "VED", "USDT"];
    
    container.innerHTML = monedas.map(m => `
        <button onclick="window.monedaGlobalFiltro='${m}'; updateDashboardMetrics('TODAS')"
                class="flex-1 py-1.5 px-2 rounded-lg text-[10px] font-black transition-all border
                ${(window.monedaGlobalFiltro || 'USD') === m 
                    ? 'bg-gray-500 text-white border-gray-800 shadow-md shadow-blue-900/40' 
                    : 'bg-gray-800/50 text-gray-500 border-gray-700 hover:border-blue-500/30'}">
            ${m}
        </button>
    `).join('');
}

// Función auxiliar para resetear si no hay datos
function resetDashboardUI() {
    ['dash-main-balance', 'dash-ingresos', 'dash-egresos', 'dash-operaciones'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = id.includes('operaciones') ? '0' : '0,00';
    });
}

/**
 * Función auxiliar para formatear y mostrar valores
 */
function animateValue(id, value, isCurrency) {
    const element = document.getElementById(id);
    if (!element) return;
    
    const numValue = parseFloat(value) || 0;
    
    // Si isCurrency es true, aplicamos tu formato de MONTO (2 decimales, etc.)
    // Si es false, simplemente mostramos el número entero
    const formatted = isCurrency 
        ? getFormattedValue('MONTO', numValue) 
        : Math.floor(numValue).toString(); 
    
    element.textContent = formatted;
}

function crearElementoSubCuenta(cta) {
    const div = document.createElement('div');
    const isSelected = String(cuentaSeleccionada || 'TODAS') === String(cta.ID);
    
    // Estilos dinámicos según selección
    div.className = `flex flex-col p-3 rounded-xl border transition-all duration-300 cursor-pointer ${
        isSelected 
        ? 'bg-blue-600/20 border-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.3)]' 
        : 'bg-slate-900/40 border-slate-700 hover:border-slate-500 hover:bg-slate-800/60'
    }`;

    // Al hacer clic, enviamos el ID de la cuenta para filtrar TD101_MAIN
    div.onclick = () => {
        updateDashboardMetrics(cta.ID);
    };

    // Construcción del contenido (NOMBRE y detalles)
    div.innerHTML = `
        <div class="flex justify-between items-start mb-1">
            <span class="text-xs font-bold uppercase tracking-wider ${isSelected ? 'text-blue-400' : 'text-slate-500'}">
                ${cta.TIPO || 'CUENTA'}
            </span>
            ${isSelected ? '<div class="w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_8px_#3b82f6]"></div>' : ''}
        </div>
        <div class="text-sm font-semibold text-slate-100 truncate">
            ${cta.NOMBRE || cta.ALIAS || 'Sin nombre'}
        </div>
        <div class="text-[10px] text-slate-400 mt-1 font-mono">
            ID: ${cta.ID}
        </div>
    `;

    return div;
}
</script>
